<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Primer administrador | Dentalmix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <img src="assets/logo_dentalmix.png" alt="Dentalmix" class="login-logo" />
    <h1>Crear primer administrador</h1>
    <p class="hint">Solo funciona mientras la pagina no tenga ningun usuario. Despues, los usuarios se crean desde la seccion Usuarios.</p>
    <form id="setup-form">
      <label>
        Clave de instalacion (variable SETUP_TOKEN de Railway)
        <input type="password" id="token" required />
      </label>
      <label>
        Nombre
        <input type="text" id="nombre" required />
      </label>
      <label>
        Email
        <input type="email" id="email" required autocomplete="username" />
      </label>
      <label>
        Contraseña (minimo 8 caracteres)
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </label>
      <div id="setup-error" class="alert alert-error" hidden></div>
      <button type="submit">Crear administrador</button>
    </form>
  </div>

  <script src="setup.js"></script>
</body>
</html>
